name: Go-Develop

on:
  push:
    branches: [ develop ]
    paths:
    - '.github/**'
    - 'cmd/**'
    - 'pkg/**'
    - 'go.mod'
    - 'go.sum'
  pull_request:
    branches: [ develop ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build -v ./cmd/backend

    - name: Test
      run: go test -v ./...
