services:
  db:
    image: mysql
    command: --sql-mode=''
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dsbd-backend
      MYSQL_USER: dsbd
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

  # Dev mail catcher: SMTP on :1025, web UI on http://127.0.0.1:1080
  maildev:
    image: maildev/maildev
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"

volumes:
  db:
    driver: local
